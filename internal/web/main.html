<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gocommit</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
      }
      button {
        display: block;
        margin: 0.25rem 0;
        padding: 0.4rem 1rem;
        cursor: pointer;
      }
      #message {
        margin-top: 1rem;
        font-weight: bold;
      }
      .navbar {
        margin-bottom: 1rem;
        display: flex;
        gap: 1rem;
        border-bottom: #ccc solid 1px;
      }
      button {
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>Gocommit</h1>

    <div class="navbar">
      <button id="tab-branches" class="tab active">Branches</button>
      <button id="tab-info" class="tab">Info</button>
    </div>

    <div id="tab-content-branches" class="tab-content active">
      <div id="branches"></div>
    </div>

    <div id="tab-content-info" class="tab-content" style="display: none">
      <div id="info">
        <h3>Remotes</h3>
        <ul id="remotes-list"></ul>
      </div>
    </div>

    <div id="message"></div>
    <footer style="margin-top: 2em; color: #888; font-size: 0.9em">
      Versione: <span id="build-version">...</span>
    </footer>
    <script>
      // Tab switching logic
      document.getElementById("tab-branches").onclick = function () {
        document.getElementById("tab-branches").classList.add("active");
        document.getElementById("tab-info").classList.remove("active");
        document.getElementById("tab-content-branches").style.display = "";
        document.getElementById("tab-content-info").style.display = "none";
      };

      document.getElementById("tab-info").onclick = function () {
        document.getElementById("tab-info").classList.add("active");
        document.getElementById("tab-branches").classList.remove("active");
        document.getElementById("tab-content-info").style.display = "";
        document.getElementById("tab-content-branches").style.display = "none";
        // Carica i remoti solo la prima volta
        if (!document.getElementById("remotes-list").dataset.loaded) {
          fetch("/remotes")
            .then((r) => r.json())
            .then((remotes) => {
              const ul = document.getElementById("remotes-list");
              ul.innerHTML = "";
              remotes.forEach((remote) => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = remote.URL;
                a.textContent = remote.Name + ": " + remote.URL;
                a.target = "_blank";
                li.appendChild(a);
                ul.appendChild(li);
              });
              ul.dataset.loaded = "1";
            });
        }
      };

      function checkout(branch) {
        fetch("/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ branch }),
        })
          .then((r) => {
            if (!r.ok) {
              return r.text().then((t) => {
                throw new Error(t);
              });
            }
            return r.json();
          })
          .then((data) => {
            document.getElementById("message").textContent =
              "Switched to: " + data.branch;
          })
          .catch((err) => {
            document.getElementById("message").textContent =
              "Error: " + err.message;
          });
      }

      fetch("/branches")
        .then((r) => r.json())
        .then((branches) => {
          const container = document.getElementById("branches");
          branches.forEach((b) => {
            const btn = document.createElement("button");
            btn.textContent = `switch to... ${b}`;
            btn.onclick = () => checkout(b);
            container.appendChild(btn);
          });
        });

      // Carica la versione build
      fetch("/version")
        .then((r) => r.text())
        .then((ver) => {
          document.getElementById("build-version").textContent = ver.trim();
        });
    </script>
  </body>
</html>
