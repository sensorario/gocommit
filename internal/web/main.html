<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gocommit</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
      }
      button {
        display: block;
        margin: 0.25rem 0;
        padding: 0.4rem 1rem;
        cursor: pointer;
        text-transform: uppercase;
      }
      #message {
        margin-top: 1rem;
        font-weight: bold;
      }
      .navbar {
        margin-bottom: 1rem;
        display: flex;
        gap: 1rem;
        border-bottom: #ccc solid 1px;
      }
      .tab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        display: inline;
        margin: 0;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 0.9em;
      }
      .tab.active {
        font-weight: bold;
        border-bottom: 2px solid #333;
      }
    </style>
  </head>
  <body>
    <h1>Gocommit</h1>

    <div class="navbar">
      <button id="tab-branches" class="tab active">Branches</button>
      <button id="tab-prs" class="tab">Pull Requests</button>
      <button id="tab-info" class="tab">Info</button>
    </div>

    <div id="tab-content-branches" class="tab-content">
      <div id="branches"></div>
    </div>

    <div id="tab-content-prs" class="tab-content" style="display: none">
      <div id="prs"></div>
    </div>

    <div id="tab-content-info" class="tab-content" style="display: none">
      <div id="info">
        <h3>Remotes</h3>
        <ul id="remotes-list"></ul>
      </div>
    </div>

    <div id="message"></div>
    <footer style="margin-top: 2em; color: #888; font-size: 0.9em; display: flex; align-items: center; gap: 1.5em;">
      <span>Version: <span id="build-version">...</span></span>
      <button id="btn-stop" style="background:#c0392b;color:#fff;border:none;border-radius:4px;padding:0.3rem 0.9rem;cursor:pointer;font-size:0.85em;" onclick="stopServer()">Stop server</button>
    </footer>
    <script>
      const TABS = ["branches", "prs", "info"];

      function showTab(name) {
        TABS.forEach((t) => {
          document.getElementById("tab-" + t).classList.remove("active");
          document.getElementById("tab-content-" + t).style.display = "none";
        });
        document.getElementById("tab-" + name).classList.add("active");
        document.getElementById("tab-content-" + name).style.display = "";
      }

      document.getElementById("tab-branches").onclick = () => showTab("branches");

      document.getElementById("tab-prs").onclick = function () {
        showTab("prs");
        const container = document.getElementById("prs");
        if (container.dataset.loaded) return;
        container.textContent = "Loading...";
        fetch("/pull-requests")
          .then((r) => {
            if (!r.ok) return r.text().then((t) => { throw new Error(t); });
            return r.json();
          })
          .then((prs) => {
            container.innerHTML = "";
            if (!prs || prs.length === 0) {
              container.textContent = "No open pull requests.";
              container.dataset.loaded = "1";
              return;
            }
            prs.forEach((pr) => {
              const btn = document.createElement("button");
              btn.textContent = "#" + pr.number + " " + pr.title;
              btn.onclick = () => window.open(pr.url, "_blank");
              container.appendChild(btn);
            });
            container.dataset.loaded = "1";
          })
          .catch((err) => {
            container.textContent = "Error: " + err.message;
          });
      };

      document.getElementById("tab-info").onclick = function () {
        showTab("info");
        const ul = document.getElementById("remotes-list");
        if (ul.dataset.loaded) return;
        fetch("/remotes")
          .then((r) => r.json())
          .then((remotes) => {
            ul.innerHTML = "";
            remotes.forEach((remote) => {
              const li = document.createElement("li");
              const a = document.createElement("a");
              let webUrl = remote.URL;
              if (webUrl.startsWith("git@github.com:")) {
                webUrl = webUrl.replace("git@github.com:", "https://github.com/");
              } else if (webUrl.startsWith("git@bitbucket.org:")) {
                webUrl = webUrl.replace("git@bitbucket.org:", "https://bitbucket.org/");
              }
              if (webUrl.endsWith(".git")) {
                webUrl = webUrl.slice(0, -4);
              }
              a.href = webUrl;
              a.textContent = remote.Name + ": " + webUrl;
              a.target = "_blank";
              li.appendChild(a);
              ul.appendChild(li);
            });
            ul.dataset.loaded = "1";
          });
      };

      function checkout(branch) {
        fetch("/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ branch }),
        })
          .then((r) => {
            if (!r.ok) return r.text().then((t) => { throw new Error(t); });
            return r.json();
          })
          .then((data) => {
            document.getElementById("message").textContent = "Switched to: " + data.branch;
          })
          .catch((err) => {
            document.getElementById("message").textContent = "Error: " + err.message;
          });
      }

      fetch("/branches")
        .then((r) => r.json())
        .then((branches) => {
          const container = document.getElementById("branches");
          branches.forEach((b) => {
            const btn = document.createElement("button");
            btn.textContent = "switch to... " + b;
            btn.onclick = () => checkout(b);
            container.appendChild(btn);
          });
        });

      fetch("/version")
        .then((r) => r.text())
        .then((ver) => {
          document.getElementById("build-version").textContent = ver.trim();
        });

      function stopServer() {
        const btn = document.getElementById("btn-stop");
        btn.disabled = true;
        btn.textContent = "Stopping...";
        const close = () => {
          document.getElementById("message").textContent = "Server stopped. Closing tab...";
          setTimeout(() => window.close(), 500);
        };
        fetch("/shutdown", { method: "POST" }).then(close).catch(close);
      }
    </script>
  </body>
</html>
