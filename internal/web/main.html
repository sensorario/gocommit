<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gocommit</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #sidebar {
        width: 220px;
        min-width: 220px;
        background: #f4f4f4;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #sidebar h2 {
        font-size: 0.8em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin: 0;
        padding: 1rem 1rem 0.5rem;
      }
      #repo-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 0.5rem 0.5rem;
      }
      .repo-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-radius: 4px;
        padding: 0.4rem 0.6rem;
        cursor: pointer;
        font-size: 0.85em;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 2px;
      }
      .repo-item:hover { background: #e8e8e8; }
      .repo-item.active {
        background: #333;
        color: #fff;
        font-weight: bold;
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 2rem;
      }
      button {
        display: block;
        margin: 0.25rem 0;
        padding: 0.4rem 1rem;
        cursor: pointer;
        text-transform: uppercase;
      }
      #message {
        margin-top: 1rem;
        font-weight: bold;
      }
      .navbar {
        margin-bottom: 1rem;
        display: flex;
        gap: 1rem;
        border-bottom: #ccc solid 1px;
      }
      .tab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        display: inline;
        margin: 0;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 0.9em;
      }
      .tab.active {
        font-weight: bold;
        border-bottom: 2px solid #333;
      }
      #tab-content-branches,
      #tab-content-prs,
      #tab-content-info {
        overflow-y: auto;
        flex: 1;
      }
      #flash {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        background: #c0392b;
        color: #fff;
        padding: 0.6rem 1.2rem 0.6rem 1rem;
        border-radius: 6px;
        font-size: 0.9em;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        z-index: 999;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        max-width: 80%;
      }
      #flash.hidden { display: none !important; }
      #flash-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 1.1em;
        cursor: pointer;
        margin: 0;
        padding: 0;
        line-height: 1;
        display: inline;
        text-transform: none;
      }
    </style>
  </head>
  <body>
    <div id="flash" class="hidden">
      <span id="flash-text"></span>
      <button id="flash-close" onclick="hideFlash()">&#x2715;</button>
    </div>

    <aside id="sidebar">
      <h2>Repositories</h2>
      <div id="repo-list"></div>
    </aside>

    <div id="main">
      <h1>Gocommit</h1>

      <div class="navbar">
        <button id="tab-branches" class="tab active">Branches</button>
        <button id="tab-prs" class="tab">Pull Requests</button>
        <button id="tab-info" class="tab">Info</button>
      </div>

      <div id="tab-content-branches" class="tab-content">
        <div id="branches"></div>
      </div>

      <div id="tab-content-prs" class="tab-content" style="display: none">
        <div id="prs"></div>
      </div>

      <div id="tab-content-info" class="tab-content" style="display: none">
        <div id="info">
          <h3>Remotes</h3>
          <ul id="remotes-list"></ul>
        </div>
      </div>

      <div id="message"></div>
      <footer style="margin-top: 2em; color: #888; font-size: 0.9em; display: flex; align-items: center; gap: 1.5em;">
        <span>Version: <span id="build-version">...</span></span>
        <button id="btn-stop" style="background:#c0392b;color:#fff;border:none;border-radius:4px;padding:0.3rem 0.9rem;cursor:pointer;font-size:0.85em;" onclick="stopServer()">Stop server</button>
      </footer>
    </div>

    <script>
      let flashTimer = null;

      function flash(msg) {
        const el = document.getElementById("flash");
        document.getElementById("flash-text").textContent = msg;
        el.classList.remove("hidden");
        clearTimeout(flashTimer);
        flashTimer = setTimeout(hideFlash, 5000);
      }

      function hideFlash() {
        document.getElementById("flash").classList.add("hidden");
      }

      const TABS = ["branches", "prs", "info"];

      function showTab(name) {
        TABS.forEach((t) => {
          document.getElementById("tab-" + t).classList.remove("active");
          document.getElementById("tab-content-" + t).style.display = "none";
        });
        document.getElementById("tab-" + name).classList.add("active");
        document.getElementById("tab-content-" + name).style.display = "";
      }

      document.getElementById("tab-branches").onclick = () => showTab("branches");

      document.getElementById("tab-prs").onclick = function () {
        showTab("prs");
        const container = document.getElementById("prs");
        if (container.dataset.loaded) return;
        container.textContent = "Loading...";
        fetch("/pull-requests")
          .then((r) => {
            if (!r.ok) return r.text().then((t) => { throw new Error(t); });
            return r.json();
          })
          .then((prs) => {
            container.innerHTML = "";
            if (!prs || prs.length === 0) {
              container.textContent = "No open pull requests.";
              container.dataset.loaded = "1";
              return;
            }
            prs.forEach((pr) => {
              const btn = document.createElement("button");
              btn.textContent = "#" + pr.number + " " + pr.title;
              btn.onclick = () => window.open(pr.url, "_blank");
              container.appendChild(btn);
            });
            container.dataset.loaded = "1";
          })
          .catch((err) => {
            container.innerHTML = '<p style="color:#c0392b;font-size:0.9em;">' + err.message + '</p>';
            flash(err.message);
          });
      };

      document.getElementById("tab-info").onclick = function () {
        showTab("info");
        const ul = document.getElementById("remotes-list");
        if (ul.dataset.loaded) return;
        fetch("/remotes")
          .then((r) => r.json())
          .then((remotes) => {
            ul.innerHTML = "";
            remotes.forEach((remote) => {
              const li = document.createElement("li");
              const a = document.createElement("a");
              let webUrl = remote.URL;
              if (webUrl.startsWith("git@github.com:")) {
                webUrl = webUrl.replace("git@github.com:", "https://github.com/");
              } else if (webUrl.startsWith("git@bitbucket.org:")) {
                webUrl = webUrl.replace("git@bitbucket.org:", "https://bitbucket.org/");
              }
              if (webUrl.endsWith(".git")) {
                webUrl = webUrl.slice(0, -4);
              }
              a.href = webUrl;
              a.textContent = remote.Name + ": " + webUrl;
              a.target = "_blank";
              li.appendChild(a);
              ul.appendChild(li);
            });
            ul.dataset.loaded = "1";
          });
      };

      function checkout(branch) {
        fetch("/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ branch }),
        })
          .then((r) => {
            if (!r.ok) return r.text().then((t) => { throw new Error(t); });
            return r.json();
          })
          .then((data) => {
            document.getElementById("message").textContent = "Switched to: " + data.branch;
          })
          .catch((err) => {
            document.getElementById("message").textContent = "Error: " + err.message;
          });
      }

      fetch("/branches")
        .then((r) => r.json())
        .then((branches) => {
          const container = document.getElementById("branches");
          branches.forEach((b) => {
            const btn = document.createElement("button");
            btn.textContent = "switch to... " + b;
            btn.onclick = () => checkout(b);
            container.appendChild(btn);
          });
        });

      fetch("/version")
        .then((r) => r.text())
        .then((ver) => {
          document.getElementById("build-version").textContent = ver.trim();
        });

      function stopServer() {
        const btn = document.getElementById("btn-stop");
        btn.disabled = true;
        btn.textContent = "Stopping...";
        const close = () => {
          document.getElementById("message").textContent = "Server stopped. Closing tab...";
          setTimeout(() => window.close(), 500);
        };
        fetch("/shutdown", { method: "POST" }).then(close).catch(close);
      }

      // Sidebar: load repos and current, wire up switching
      let currentRepo = "";

      function basename(path) {
        return path.replace(/\/$/, "").split("/").pop();
      }

      function loadSidebar() {
        Promise.all([
          fetch("/repositories").then((r) => r.json()),
          fetch("/current-repo").then((r) => r.json()),
        ]).then(([repos, current]) => {
          currentRepo = current;
          const list = document.getElementById("repo-list");
          list.innerHTML = "";
          (repos || []).forEach((path) => {
            const btn = document.createElement("button");
            btn.className = "repo-item" + (path === current ? " active" : "");
            btn.textContent = basename(path);
            btn.title = path;
            btn.onclick = () => switchRepo(path);
            list.appendChild(btn);
          });
        });
      }

      function switchRepo(path) {
        if (path === currentRepo) return;
        fetch("/switch-repo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path }),
        })
          .then((r) => {
            if (!r.ok) return r.text().then((t) => { throw new Error(t); });
            return r.json();
          })
          .then(() => {
            document.getElementById("prs").dataset.loaded = "";
            document.getElementById("remotes-list").dataset.loaded = "";
            document.getElementById("branches").innerHTML = "";
            document.getElementById("message").textContent = "";
            loadSidebar();
            reloadBranches();
            showTab("branches");
          })
          .catch((err) => {
            flash(err.message);
          });
      }

      function reloadBranches() {
        fetch("/branches")
          .then((r) => r.json())
          .then((branches) => {
            const container = document.getElementById("branches");
            container.innerHTML = "";
            branches.forEach((b) => {
              const btn = document.createElement("button");
              btn.textContent = "switch to... " + b;
              btn.onclick = () => checkout(b);
              container.appendChild(btn);
            });
          });
      }

      loadSidebar();
    </script>
  </body>
</html>
